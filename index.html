<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Rummikub 2D 多人連線拉密 (官方安全加密合流版)</title>
  <meta name="description" content="100% 純雲端 WSS 加密 MQTT 頻道聯機，內建即時二維碼掃描進房功能，支援 3D 翻牌抽取順序動畫。" />

  <!-- 公開 Paho MQTT JavaScript 客戶端 CDN -->
  <script src="https://cloudflare.com"></script>
  <!-- 引入輕量級不依賴後端的 QR Code 渲染引擎 -->
  <script src="https://cloudflare.com"></script>
  <script>
    if (typeof Paho === 'undefined') {
      document.write('<script src="https://unpkg.com"><\/script>');
    }
  </script>

  <style>
    :root {
      --bg-dark: #090d16;
      --bg-panel: #131a29;
      --bg-card: #1e283d;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #0284c7;
      --accent-hover: #0369a1;
      --success: #10b981;
      --success-hover: #059669;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --warning: #f59e0b;
      --cyan: #06b6d4;
      --gold: #eab308;
    }

    * {
      box-sizing: border-box;
      margin: 0; padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    header {
      background: var(--bg-panel);
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
      z-index: 20;
    }

    .brand h1 { font-size: 15px; font-weight: 700; }

    button {
      cursor: pointer; border: none; outline: none; border-radius: 8px;
      font-weight: 600; padding: 8px 12px; transition: all 0.2s ease;
      display: inline-flex; align-items: center; justify-content: center;
      gap: 6px; font-size: 13px; min-height: 38px;
    }
    button:hover:not(:disabled) { transform: translateY(-1px); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-primary { background: var(--accent); color: white; }
    .btn-success { background: var(--success); color: white; }
    .btn-secondary { background: #273549; color: #e2e8f0; }
    .btn-danger { background: var(--danger); color: white; }

    .btn-confirm-play {
      background: linear-gradient(135deg, #059669, #10b981);
      color: white; font-size: 14px; font-weight: 800;
      padding: 10px 18px; border-radius: 10px; min-height: 44px;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
    }

    main {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 8px; max-width: 1200px; width: 100%; margin: 0 auto;
    }

    /* 完美的 Waiting Room 介面 */
    #lobby-section {
      background: var(--bg-panel); padding: 24px 20px; border-radius: 18px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.65); border: 1px solid rgba(255,255,255,0.08);
      width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 14px;
    }

    .lobby-header { text-align: center; }
    .lobby-header h2 {
      font-size: 20px; font-weight: 800;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 4px;
    }

    .input-field { display: flex; flex-direction: column; gap: 5px; }
    .input-field label { font-size: 13px; font-weight: 700; color: #cbd5e1; }
    .input-field input { padding: 12px 14px; border-radius: 9px; background: #090d16; border: 1px solid #2d3b52; color: white; font-size: 15px; min-height: 44px; }

    #game-section { display: none; flex-direction: column; align-items: center; width: 100%; gap: 10px; }
    #canvas-container { position: relative; background: #090c10; border-radius: 14px; width: 100%; max-width: 960px; overflow: hidden; aspect-ratio: 960 / 560; border: 1px solid rgba(255,255,255,0.08); }
    canvas { display: block; width: 100%; height: 100%; }

    .controls-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; width: 100%; max-width: 960px; background: var(--bg-panel); padding: 10px 14px; border-radius: 12px; gap: 8px; }
    .status-left-panel { display: flex; align-items: center; gap: 8px; font-size: 12px; flex-wrap: wrap; width: 100%; }
    .status-badge { background: rgba(6, 182, 212, 0.15); border: 1px solid rgba(6, 182, 212, 0.4); color: #38bdf8; padding: 4px 8px; border-radius: 6px; font-weight: 700; font-size: 12px; }

    .action-buttons { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; width: 100%; }

    #waiting-room-dashboard { background: #090d16; border-radius: 12px; padding: 14px; border: 1px solid #2d3b52; display: flex; flex-direction: column; gap: 10px; }
    .player-card { background: #1e283d; border-radius: 8px; padding: 10px 12px; display: flex; align-items: center; justify-content: space-between; border: 1px solid rgba(255,255,255,0.05); }
    .online-dot { width: 8px; height: 8px; background: #10b981; border-radius: 50%; display: inline-block; box-shadow: 0 0 8px #10b981; }

    .qrcode-wrapper {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #ffffff; padding: 12px; border-radius: 14px; width: 154px; height: 154px; margin: 10px auto;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3); border: 3px solid var(--accent);
    }

    #toast-notification { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: rgba(15, 23, 42, 0.96); color: #f8fafc; padding: 10px 18px; border-radius: 10px; font-size: 13px; font-weight: 700; border: 1px solid rgba(255,255,255,0.15); z-index: 200; display: none; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <h1>Rummikub 拉密 <span style="font-size: 12px; color: var(--cyan);">安全加密 WSS 終極通暢版</span></h1>
    </div>
    <div class="header-actions">
      <div id="room-code-tag" style="display: none; align-items: center; gap: 4px; background: rgba(56, 189, 248, 0.15); border: 1px solid #38bdf8; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 800; color: #38bdf8;">
        <span>房號：<strong id="display-room-code">------</strong></span>
        <button class="btn-secondary" style="padding: 2px 6px; font-size: 10px; min-height: 24px;" onclick="copyRoomShareLink()">📋 複製連結</button>
      </div>
      <button class="btn-primary" style="min-height: 32px; padding: 4px 8px;" onclick="downloadSingleHtmlFile()">💾 下載單檔</button>
      <button id="header-btn-leave" class="btn-danger" onclick="clientLeaveRoom()" style="display: none; min-height: 32px; padding: 4px 10px;">🚪 離開</button>
    </div>
  </header>

  <main>
    <section id="lobby-section">
      <div class="lobby-header">
        <h2>🎲 多人拉密對局大廳</h2>
        <p style="font-size: 12px; color: var(--text-sub);">採用 EMQX 官方安全加密憑證，完美打通手機與電腦連線！</p>
      </div>

      <div id="lobby-input-inputs">
        <div class="input-field" style="margin-bottom: 10px;">
          <label>自訂房號（Room ID）</label>
          <input type="text" id="input-room" placeholder="例如：ROOM88" style="text-transform: uppercase;" />
        </div>
        <div class="input-field" style="margin-bottom: 14px;">
          <label>玩家暱稱</label>
          <input type="text" id="input-name" placeholder="請輸入暱稱" maxlength="10" />
        </div>
        <button class="btn-primary" style="width: 100%; padding: 12px; font-size: 15px; font-weight: 800; min-height: 46px;" onclick="clientEnterRoom()">🚀 進入 / 創建房間</button>
      </div>

      <div id="waiting-room-area" style="display: none; flex-direction: column; gap: 10px;">
        <div style="text-align: center; margin-bottom: 4px;">
          <span style="font-size: 12px; color: var(--text-sub);">📱 手機相機直接掃碼即可秒速加入對局：</span>
          <div class="qrcode-wrapper">
            <div id="qrcode-container"></div>
          </div>
        </div>
        <h3 style="font-size: 14px; color: var(--cyan); font-weight: bold;">👥 當前房間玩家名單：</h3>
        <div id="waiting-room-dashboard"></div>
        <div id="lobby-hint-txt" style="text-align: center; font-size: 12px; color: var(--text-sub); margin-top: 4px;"></div>
        <button id="btn-lobby-start" class="btn-success" style="width: 100%; padding: 10px; font-weight: bold; min-height: 44px; display: none;" onclick="hostStartGame()">🎲 隨機抽籤開始遊戲</button>
      </div>
    </section>

    <section id="game-section">
      <div id="canvas-container">
        <canvas id="game-canvas" width="960" height="560"></canvas>
      </div>
      <div class="controls-bar">
        <div class="status-left-panel">
          <span class="status-badge" id="ice-melt-badge">❄ 尚未破冰</span>
          <span class="status-badge" id="selected-count-badge">已選取 0 張手牌</span>
          <span id="instruction-hint" style="color: #94a3b8;">遊戲進行中...</span>
        </div>
        <div class="action-buttons">
          <button id="btn-confirm-play" class="btn-confirm-play" onclick="clientPlaySelectedCards()" disabled>🚀 確認出牌</button>
          <button class="btn-secondary" onclick="clientResetTurn()" id="btn-reset">↺ 復原手牌</button>
          <button class="btn-danger" onclick="clientDrawPass()" id="btn-draw">📥 抽牌並 Pass</button>
          <button class="btn-success" onclick="clientEndTurn()" id="btn-end">✔ 結束回合</button>
        </div>
      </div>
    </section>
  </main>

  <div id="toast-notification"></div>

  <script>
    // 💡 終極核心修復一：高精度、防重疊的無碰撞 Player ID，徹底消滅手機電腦 ID 撞車 Bug
    const myPlayerId = 'p_uid_' + Math.floor(Math.random() * 9999999).toString(36) + '_' + Date.now().toString(36);
